<!DOCTYPE html>
<html>
<head>
<title>MemGame-1</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"><link type="text/css" rel="stylesheet" href="resources/sheet.css" >

<style type="text/css">
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #7275f4;
    display: flex;
    justify-content: center;
    align-items: center;
}

.big-table {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    aspect-ratio: 1 / 1.45;
    border: 10pt outset orange;
    background-color: yellow;
    text-align: center;
    font-family: Times;
    font-weight: 800;
    margin: 0 auto;
    color: #000;
    width: 100%;
    max-width: 100vh;
    height: auto;
}

/* Define proportional heights */
.game-title {
    flex: 0 0 20%;
    font-size: clamp(3.75rem, 3.75vw, 4rem);
    color: #2005af;
    display: flex;
    align-items: center;
    justify-content: center;
}

.button-container {
    flex: 0 0 15%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 5px;
}

.button-container .button {
    flex: 1;
    height: 80%;
    margin: 0 10px;
    border: 7px outset #706f6f;
    border-radius: 15%;
    box-shadow: 0 5px 10px #00000033;
    outline: none;
    padding: 0;
    font-family: Verdana, sans-serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 800;
    line-height: 1;
    text-decoration: none;
    color: black;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    cursor: pointer;
}

.button-container .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
}

.button-container .button:active {
    transform: translateY(0);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    border-style: inset;
}

.master-table-container {
    flex: 1 1 65%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 10px outset blue;
    border-radius: 0px;
    background-color: #fcf4dd;
    padding: 0.5rem;
    margin: 1%;
}

.master-table {
    width: 100%;
    height: 100%;
/*    background-color: #f9f4a6; */
    table-layout: fixed;
    border-collapse: separate;
}

    .b-cell {
    height:calc(100% / 6);
    border: 4px solid grey;
    border-radius: 25%;
    background-color: white;
    text-align: center;
    font-size: clamp(1vh, 30pt, 5vh);
    line-height: 1.1;
    transition: opacity 0.5s ease-in-out;
}
    .b-cell.invisible-text {
    color: transparent;
    text-shadow: none;
}
    
    .c-Cell-A, .c-Cell-B, .c-Cell-C, .c-Cell-D { border: 4px solid #a0aec0; background-color: white; font-size:  clamp(5vh, 60pt, 9vh); padding:0 20pt;}

    .c-Cell-A { border-radius: 100% 0 0 0; vertical-align: bottom; text-align: right;}
    .c-Cell-B { border-radius: 0 100% 0 0; vertical-align: bottom; text-align: left; }
    .c-Cell-C { border-radius: 0 0 100% 0; vertical-align: top; text-align: left; }
    .c-Cell-D { border-radius: 0 0 0 100%; vertical-align: top; text-align: right; } 
         
    .masterTable td:not(.c-Cell-A, .c-Cell-B, .c-Cell-C, .c-Cell-D):hover {
        transform: scale(1.03); background-color: yellow;
    }

    /* Keyframe animation for shake effect */
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }
    /* Game result animation */
    @keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.game-title.pop {
  animation: pop 0.4s ease;
}

    
</style>
<body>
  <div class="big-table" id="bigTable">
    <div class="game-title" id="gameTitle">Find the Numbers!</div>

    <div class="button-container">
      <div class="button full-screen-button" id="fullScreenButton" style="background-color: #a9a6f9">FULL<br>SCREEN</div>
      <div class="button new-game-button" id="newGameButton" style="background-color: #b6f197">NEW<br>GAME</div>
      <div class="button game-over-button" id="gameOverButton" style="background-color: #f1a697">
        <a href="../Choice.html">GAME<br>OVER</a>
      </div>
    </div>

    <div class="master-table-container">
      <table class="master-table" id="masterTable" cellspacing="5">
        <tr>
                <td class="b-cell" id="cell-0">1</td>
                <td class="b-cell" id="cell-1">2</td>
                <td class="b-cell" id="cell-2">3</td>
                <td class="b-cell" id="cell-3">4</td>
                <td class="b-cell" id="cell-4">5</td>
                <td class="b-cell" id="cell-5">6</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-6">20</td>
                <td class="c-Cell-A" colspan="2" rowspan="2" id="cell-14">A</td>
                <td class="c-Cell-B" colspan="2" rowspan="2" id="cell-15">B</td>
                <td class="b-cell" id="cell-11">7</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-12">19</td>
                <td class="b-cell" id="cell-17">8</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-18">18</td>
                <td class="c-Cell-D" colspan="2" rowspan="2" id="cell-20">D</td>
                <td class="c-Cell-C" colspan="2" rowspan="2" id="cell-21">C</td>
                <td class="b-cell" id="cell-23">9</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-24">17</td>
                <td class="b-cell" id="cell-29">10</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-30">16</td>
                <td class="b-cell" id="cell-31">15</td>
                <td class="b-cell" id="cell-32">14</td>
                <td class="b-cell" id="cell-33">13</td>
                <td class="b-cell" id="cell-34">12</td>
                <td class="b-cell" id="cell-35">11</td>
            </tr>
      </table>
    </div>
  </div>

<script>
    function resizeBigTable() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const portraitRatio = 1 / 1.45;
      const bigTable = document.querySelector('.big-table');
      // Calculate which dimension to use so the table always fits
      if (vw / vh < portraitRatio) {
        // Screen is too tall, fit width
        bigTable.style.width = vw + 'px';
        bigTable.style.height = (vw / portraitRatio) + 'px';
      } else {
        // Screen is too wide, fit height
        bigTable.style.height = vh + 'px';
        bigTable.style.width = (vh * portraitRatio) + 'px';
      }
    }
    window.addEventListener('resize', resizeBigTable);
    window.addEventListener('DOMContentLoaded', resizeBigTable);

    function endGameWin() {
        gameTitle.textContent = "You Won!!!"; // Change title to victory message
        isGameActive = false; // Set game to inactive
        newGameButton.disabled = false; // Ensure the new game button is enabled for replay
        gameOverButton.disabled = true; // Disable game over button when won

        // Disable clicks on all cells to prevent further interaction after winning
        masterCells.forEach(cell => {
            cell.style.pointerEvents = 'none'; // Disable pointer events
            cell.onclick = null; // Remove the click event listener
        });
    }

    if (fullScreenButton) {
        fullScreenButton.addEventListener('click', () => {
            // Check if full screen is even enabled by the browser/environment
            if (!document.fullscreenEnabled) {
                console.warn("Full-screen mode is not enabled or allowed by this browser/environment.");
                alert("Full-screen mode is currently restricted by your browser or the embedding environment (e.g., an iframe). Please check your browser settings or ensure the page is opened directly, not embedded.");
                return; // Exit the function if not enabled
            }

            if (!document.fullscreenElement) {
                // If not in full-screen, request full-screen for the whole document
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
                        alert("Full-screen mode could not be activated. This is often due to browser security policies or if the page is embedded in an iframe without the 'allowfullscreen' attribute.");
                    } else {
                        alert("Full-screen mode could not be activated due to an unexpected error.");
                    }
                });
            } else {
                // If in full-screen, exit full-screen
                document.exitFullscreen().catch(err => {
                    console.error(`Error attempting to exit full-screen mode: ${err.message} (${err.name})`);
                    alert("Error exiting full-screen mode.");
                });
            }
        });
    }

    // Initialize the game when the DOM content has loaded
    document.addEventListener('DOMContentLoaded', initializeGame);

// Actions by ChatGPT
  const gameTitle = document.getElementById("gameTitle");
  const newGameButton = document.getElementById("newGameButton");
  const masterCells = document.querySelectorAll(".b-cell");

  const cCells = {
    A: document.getElementById("cell-14"),
    B: document.getElementById("cell-15"),
    C: document.getElementById("cell-21"),
    D: document.getElementById("cell-20")
  };

  let rightNumbers = [];
  let foundNumbers = new Set();
  let isGameActive = false;
  let countdownInterval;

  function getRandomUniqueNumbers(count, min, max) {
    const nums = new Set();
    while (nums.size < count) {
      nums.add(Math.floor(Math.random() * (max - min + 1)) + min);
    }
    return Array.from(nums);
  }

  function assignCornerCells(numbers) {
    const keys = Object.keys(cCells);
    keys.forEach((key, i) => {
      cCells[key].textContent = numbers[i];
      cCells[key].style.backgroundColor = "";
    });
  }

  function resetCornerCells() {
    cCells.A.textContent = "A";
    cCells.B.textContent = "B";
    cCells.C.textContent = "C";
    cCells.D.textContent = "D";

    Object.values(cCells).forEach(cell => {
      cell.style.backgroundColor = "";
    });
  }

  function clearBoard() {
    masterCells.forEach(cell => {
      cell.textContent = "";
      cell.classList.add("invisible-text"); // Keep layout but hide numbers
      cell.style.backgroundColor = "white";
      cell.style.pointerEvents = "none";
    });
  }

  function populateBoard(numbers) {
    masterCells.forEach((cell, i) => {
      cell.textContent = numbers[i];
      cell.classList.remove("invisible-text");
      cell.style.pointerEvents = "auto";
    });
  }

  function updateTitleCountdown(seconds) {
    gameTitle.textContent = `${seconds}s`;
  }

  function endGame(win) {
    isGameActive = false;
    clearInterval(countdownInterval);

    if (win) {
      gameTitle.textContent = "You WON!!!";
    } else {
      gameTitle.textContent = "You LOST!!!";
      // Reveal missed numbers in c-cells in red
      rightNumbers.forEach(num => {
        if (!foundNumbers.has(num)) {
          const index = rightNumbers.indexOf(num);
          const cCell = Object.values(cCells)[index];
          cCell.textContent = num;
          cCell.style.backgroundColor = "red";
        }
      });
    }

    // Disable further clicking
    masterCells.forEach(cell => {
      cell.style.pointerEvents = "none";
    });
  }

  function handleCellClick(e) {
    if (!isGameActive) return;

    const cell = e.currentTarget;
    const num = parseInt(cell.textContent);
    const index = rightNumbers.indexOf(num);

    if (rightNumbers.includes(num)) {
      if (!foundNumbers.has(num)) {
        foundNumbers.add(num);
        const cCell = Object.values(cCells)[index];
        cCell.textContent = num;
        cCell.style.backgroundColor = "green";
        cell.style.backgroundColor = "green";
        cell.style.pointerEvents = "none";

        if (foundNumbers.size === 4) {
          endGame(true);
        }
      }
    } else {
      cell.style.backgroundColor = "red";
      cell.style.pointerEvents = "none";
      setTimeout(() => {
        cell.style.backgroundColor = "white";
        cell.style.pointerEvents = "auto";
      }, 1000);
    }
  }

  function startPlayerPhase() {
    isGameActive = true;
    let secondsLeft = 15;
    updateTitleCountdown(secondsLeft);

    countdownInterval = setInterval(() => {
      secondsLeft--;
      updateTitleCountdown(secondsLeft);
      if (secondsLeft <= 0) {
        clearInterval(countdownInterval);
        endGame(false);
      }
    }, 1000);
  }

  function startGame() {
    clearInterval(countdownInterval);
    isGameActive = false;
    foundNumbers.clear();

    resetCornerCells();
    clearBoard();

    // Generate right numbers (1–20)
    rightNumbers = getRandomUniqueNumbers(4, 1, 20);
    assignCornerCells(rightNumbers);

    // 5-second countdown before showing board
    let secondsLeft = 5;
    updateTitleCountdown(secondsLeft);

    countdownInterval = setInterval(() => {
      secondsLeft--;
      updateTitleCountdown(secondsLeft);
      if (secondsLeft <= 0) {
        clearInterval(countdownInterval);

        resetCornerCells(); // Hide right numbers again

        const allNumbers = getRandomUniqueNumbers(20, 1, 20);
        populateBoard(allNumbers); // Reveal numbers in grid

        masterCells.forEach(cell => {
          cell.addEventListener("click", handleCellClick);
        });

        startPlayerPhase(); // Begin 15-second round
      }
    }, 1000);
  }

  function initializeGame() {
    newGameButton.addEventListener("click", startGame);
    clearBoard();
    resetCornerCells();
    gameTitle.textContent = "Find the Numbers!";
  }

  window.addEventListener("DOMContentLoaded", () => {
    resizeBigTable(); // your existing scaling logic
    initializeGame();
  });

  window.addEventListener("resize", resizeBigTable);
</script>

</body>

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBeep({ frequency = 440, duration = 150, type = 'sine', volume = 0.5, delay = 0 } = {}) {
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();

  oscillator.type = type;
  oscillator.frequency.value = frequency;

  gainNode.gain.value = volume;

  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  const startTime = audioCtx.currentTime + delay / 1000;
  oscillator.start(startTime);
  oscillator.stop(startTime + duration / 1000);
}
