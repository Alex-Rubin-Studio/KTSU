<!DOCTYPE html>
<html>
<head>
<title>Abc-09</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"><link type="text/css" rel="stylesheet" href="resources/sheet.css" >

<style type="text/css">

    .big-table { 
        aspect-ratio: 1 / 1.45;
        border: 10pt outset orange;
        margin: 0 auto;
        background-color: #e4e9ff;
        text-align:center;
        color:#000000;font-family:Times; font-size:36pt; font-weight: 800; line-height: 0; vertical-align:center; white-space:nowrap;direction:ltr;
    }
        /* When aspect ratio is LESS THAN 1/1.45 (portrait-ish) */
@media (max-aspect-ratio: 1/1.45) {
  .big-table { width: 98vmin; height: auto; }
}
/* When aspect ratio is GREATER THAN 1/1.45 (landscape-ish) */
@media (min-aspect-ratio: 1/1.45) {
  .big-table { height: 96vmin; width: auto; }
}
    .game-title { height: 15%; border:none; font-size:clamp(1rem, 10vw, 3.5rem); color: blue; line-height: 1.1; }
    .button-container { height: 10%; border: 0px solid black; }
    .button-container button { width: 75%; border: 7px outset; border-radius: 15%; border-color: grey; box-shadow: 0 5px 10px #00000033; margin: 0; outline: none; color: black; font-family:Verdana; font-size:clamp(.25rem, 3vw, 1.1rem); font-weight: 800; text-decoration: none; }
    #fullScreen { background-color: #ffff54; }
    #newGame { background-color: #b6f197; }
    #gameOver { background-color: #f1a697; }
    .s2, .grouped-cell { width: calc(100% / 6); border:4px solid grey; border-radius: 25%; background-color:white;  line-height: 1.1;} 
    .s2 { height: 14%; }
    
</style>
<body>
<div>
    <table class="big-table" cellspacing="5">
        <tbody>
        <tr class="game-title">
            <td colspan="6">Find the ABCs!</td>
        </tr>
            <tr>
                <td class="button-container" colspan="2"><button id="fullScreen">FULL<br>SCREEN</button></td>
                <td class="button-container" colspan="2"><button id="newGame">NEW<br>GAME</button></td>
                <td class="button-container" colspan="2"><button id="gameOver">GAME<br>OVER</button></td>
            </tr>
            <tr>
                <td class="s2" id="cell-0">A</td>
                <td class="s2" id="cell-1">B</td>
                <td class="grouped-cell" id="groupedCell" colspan="2" rowspan="2"></td>
                <td class="s2" id="cell-2">C</td>
                <td class="s2" id="cell-3">D</td>
            </tr>
            <tr>
                <td class="s2" id="cell-4">E</td>
                <td class="s2" id="cell-5">F</td>
                <td class="s2" id="cell-6">G</td>
                <td class="s2" id="cell-7">H</td></tr>
            <tr>
                <td class="s2" id="cell-8">I</td>
                <td class="s2" id="cell-9">J</td>
                <td class="s2" id="cell-10">K</td>
                <td class="s2" id="cell-11">L</td>
                <td class="s2" id="cell-12">M</td>
                <td class="s2" id="cell-13">N</td>
            </tr>
            <tr>
                <td class="s2" id="cell-14">O</td>
                <td class="s2" id="cell-15">P</td>
                <td class="s2" id="cell-16">Q</td>
                <td class="s2" id="cell-17">R</td>
                <td class="s2" id="cell-18">S</td>
                <td class="s2" id="cell-19">T</td>
            </tr>
            <tr>
                <td class="s2" id="cell-20">U</td>
                <td class="s2" id="cell-21">V</td>
                <td class="s2" id="cell-22">W</td>
                <td class="s2" id="cell-23">X</td>
                <td class="s2" id="cell-24">Y</td>
                <td class="s2" id="cell-25">Z</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
