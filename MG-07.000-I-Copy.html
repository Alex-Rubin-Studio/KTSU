<!DOCTYPE html>
<html lang="en">
<head>
    <title>MG-07.000-I-Copy.</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #685ad6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(5vh + 1.5vw);
        }

        .big-table {
            display: flex;
            flex-shrink: 1;
            flex-direction: column;
            box-sizing: border-box;
            aspect-ratio: 1 / 1.45;
            border: 10pt outset orange;
            background-color: #700227;
            text-align: center;
            font-family: Times;
            font-weight: 800;
            line-height: 1;
            margin: 0 auto;
            color: #000;
            width: 100%;
            max-width: 100vh;
            height: auto;
            min-width: 360px;
            min-height: 800px;
        }

        .grid-container {
            display: grid;
            grid-template-rows: 2fr 1.2fr 1.2fr 9fr;
            border: 5px solid lime;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            min-height: 0;
        }

        .grid-section {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            font-weight: bold;
            color: #020754;
            padding: 0rem;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
        }

        
        .game-title, .score-container, .button-container, .intro-container, .question-table-container, .answer-table-container { border:  2px solid white; }
        
        .score-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            margin: 1% 0 0 0;
        }

        .score-container-item {
            border: 0px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            margin: 0 7%;
        }

        .button-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            place-items: center;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 1%;
            background-color: #458760;
            border: 2px solid white;
            min-width: 0;
            min-height: 0;
        }

        .button-container .button {
            flex: 1 1 auto;
            height: 96%;
            width: 75%;
            margin: 2%;
            border: 4px outset #020754;
            border-radius: 10%;
            box-shadow: 0 5px 10px #00000033;
            outline: none;
            padding: 0;
            font-family: Courier-New, sans-serif;
            font-size: .3rem;
            font-weight: 800;
            line-height: 1;
            text-decoration: none;
            color: black;
            text-align: center;
            display: flex;
            justify-content: center;
            flex-direction: column;
            cursor: pointer;
        }

        .intro-container, .question-table-container, .answer-table-container {
            width: 85%; /* Consistent width for both game boards */
            aspect-ratio: 1; /* Maintain a square shape */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .question-table {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 5%;
            padding: 1%;
            width: 100%;
            height: 100%;
            place-items: center;
        }

        .answer-table {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3%;
            width: 100%;
            height: 100%;
            place-items: center;
        }

        .i-cell, .q-cell, .a-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 25%;
            font-size: .55rem;
            width: 100%;
            height: 100%;
        }

        .i-cell, .q-cell {
            border: 8px solid orange;
        }

        .a-cell {
            border: 6px solid orange;
            cursor: pointer;
        }

        /* Responsive scaling for images */
        .i-cell img, .q-cell img, .a-cell img {
            width: 70%;
            height: 70%;
        }
        
        .correct {
            background-color: #92e6a9 !important; /* Green for correct answers */
        }

        .incorrect {
            background-color: #f69494 !important; /* Red for incorrect answers */
        }

        .glowing-diamond {
            filter: drop-shadow(0 0 5px #0ff) drop-shadow(0 0 10px #0ff) drop-shadow(0 0 15px #0ff);
        }
        
        .hidden {
            display: none;
        }

    </style>
</head>
<body>

    </div>

<script>
        function resizeBigTable() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const portraitRatio = 1 / 1.45;
            const bigTable = document.querySelector('.big-table');
            // Calculate which dimension to use so the table always fits
            if (vw / vh < portraitRatio) {
                // Screen is too tall, fit width
                bigTable.style.width = vw + 'px';
                bigTable.style.height = (vw / portraitRatio) + 'px';
            } else {
                // Screen is too wide, fit height
                bigTable.style.height = vh + 'px';
                bigTable.style.width = (vh * portraitRatio) + 'px';
            }
        }
        window.addEventListener('resize', resizeBigTable);
        window.addEventListener('DOMContentLoaded', resizeBigTable);
