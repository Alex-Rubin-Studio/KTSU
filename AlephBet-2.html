<!DOCTYPE html>
<html lang="en">
<head>
    <title>AlephBet-2</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #dadaff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: calc(5vh + 1vw);
        }
        .big-table {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            aspect-ratio: 1 / 1.45;
            border: 10pt outset blue;
            background-color: white;
            text-align: center;
            font-family: Times;
            font-weight: 800;
            line-height: 1;
            margin: 0 auto;
            color: #000;
            width: 100%;
            max-width: 100vh;
            height: auto;
            min-height: 450px;
            min-width: 310px;
        }
        .grid-container {
            display: grid;
            grid-template-rows: 2fr 1fr 1.5fr 9fr;
            box-sizing: border-box;
            flex: 1;
            min-width: 0;
            min-height: 0;
        }
        .grid-section {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .8rem;
            font-weight: bold;
            color: #020754;
            padding: 0rem;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
        }

        /* Title container style (keeps layout) */
        .game-title {
            color: blue;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Actual title text (single-line, will be resized by JS) */
        #gameTitleText {
            white-space: nowrap;
            display: inline-block;
            padding: 0 3%;
            font-weight: bold;
            /* initial fallback size; JS will adjust to fit */
            font-size: 2.5rem;
            line-height: 1;
        }

        .score-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            border: 8pt red;
            width: 100%;
            height: 100%;
            margin: 1% 0 0 0;
        }
        .score-container-item {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 7%;
        }
        .button-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            place-items: center;
            width: 100%;
            height: 100%;
            padding: 1%;
            border-radius: 0%;
            background-color: blue;
            margin: 2% 2% 0 2%;
        }
        .button-container .button {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 70%;
            width: 75%;
            margin: 2%;
            border: 4pt outset white;
            border-radius: 10%;
            box-shadow: 0 5px 10px #00000033;
            outline: none;
            font-family: Courier-New, sans-serif;
            font-size: clamp(.25vh, .6rem, 2vh);
            font-weight: bold;
            line-height: 1;
            color: black;
            cursor: pointer;
        }
        .intro-container, .question-table-container, .answer-table-container {
            width: 85%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .question-table, .answer-table {
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
        }
        .question-table {
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 5%;
        }
        .answer-table {
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 3%;
        }
        .i-cell, .q-cell, .a-cell {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #dadaff;
            border-radius: 25%;
            width: 100%;
            height: 100%;
        }
        .i-cell, .q-cell {
            border: 8px solid blue;
        }
        .i-cell { font-size: 4.5rem; }
        .q-cell { font-size: 2.5rem; }
        .a-cell { font-size:  1rem;
                 border: 6px solid blue;
                 cursor: pointer;            
        }
        .i-cell img, .q-cell img, .a-cell img {
            width: 70%;
            height: 70%;
            transition: opacity 0.5s ease-in-out;
        }

        /* Fade only the inner content of the intro cell */
        #introContent {
            transition: opacity 0.5s ease-in-out;
            display: inline-block;
            width: 100%;
            text-align: center;
            /* inherit big font-size from .i-cell */
            font-size: inherit;
            line-height: 1;
        }

        .correct { background-color: #92e6a9 !important; }
        .incorrect { background-color: #f69494 !important; }
        .glowing-BlueDiamond {
            filter: drop-shadow(0 0 5px #0ff) drop-shadow(0 0 10px #0ff) drop-shadow(0 0 15px #0ff);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="big-table" id="bigTable">
        <div class="grid-container">
            <div class="grid-section game-title"><span id="gameTitleText">CHECK YOUR MEMORY!</span></div>
            <div class="grid-section section-2">
                <div class="score-container">
                    <div class="score-container-item" id="score-item-1"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-2"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-3"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-4"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-5"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-6"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-7"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-8"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-9"><img src="BlueDiamond.png" alt=""></div>
                    <div class="score-container-item" id="score-item-10"><img src="BlueDiamond.png" alt=""></div>
                </div>
            </div>
            <div class="grid-section section-3">
                <div class="button-container">
                    <div class="button" id="fullScreenButton" style="background-color: #a9a6f9">FULL<br>SCREEN</div>
                    <div class="button" id="newGameButton" style="background-color: #b6f197">NEW<br>GAME</div>
                    <div class="button" id="gameOverButton" style="background-color: #f1a697"><a href="https://alex-rubin-studio.github.io/GameIntro/GameChoice.html">GAME<br>OVER</a></div>
                </div>
            </div>
            <div class="grid-section section-4">
                <div class="intro-container" id="intro-container">
                    <div class="i-cell" id="i-cell"><span id="introContent">?</span></div>
                </div>
                <div class="question-table-container hidden" id="question-table-container">
                    <div class="question-table">
                        <div class="q-cell" id="cell-q1"></div>
                        <div class="q-cell" id="cell-q2"></div>
                        <div class="q-cell" id="cell-q3"></div>
                        <div class="q-cell" id="cell-q4"></div>
                    </div>
                </div>
                <div class="answer-table-container hidden" id="answer-table-container">
  <div class="answer-table">
    <div class="a-cell" data-index="0"></div>
    <div class="a-cell" data-index="1"></div>
    <div class="a-cell" data-index="2"></div>
    <div class="a-cell" data-index="3"></div>
    <div class="a-cell" data-index="4"></div>
    <div class="a-cell" data-index="5"></div>
    <div class="a-cell" data-index="6"></div>
    <div class="a-cell" data-index="7"></div>
    <div class="a-cell" data-index="8"></div>
    <div class="a-cell" data-index="9"></div>
    <div class="a-cell" data-index="10"></div>
    <div class="a-cell" data-index="11"></div>
    <div class="a-cell" data-index="12"></div>
    <div class="a-cell" data-index="13"></div>
    <div class="a-cell" data-index="14"></div>
    <div class="a-cell" data-index="15"></div>
  </div>
</div>
            </div>
        </div>
    </div>

<script>
(() => {
  'use strict';

  // Elements
  const gameTitleContainer = document.querySelector('.game-title');
  const gameTitleText = document.getElementById('gameTitleText');
  const introContainer = document.getElementById('intro-container');
  const questionContainer = document.getElementById('question-table-container');
  const answerContainer = document.getElementById('answer-table-container');
  const newGameButton = document.getElementById('newGameButton');
  const gameOverButton = document.getElementById('gameOverButton');
  const fullScreenButton = document.getElementById('fullScreenButton');
  const introCell = document.getElementById('i-cell');
  const introContent = document.getElementById('introContent');

  const qCells = Array.from(document.querySelectorAll('.q-cell'));
  const aCells = Array.from(document.querySelectorAll('.a-cell'));
  const BlueDiamonds = Array.from({ length: 10 }, (_, i) =>
    document.querySelector(`#score-item-${i + 1} img`)
  );

  let rightLetters = [];
  let answerPool = [];
  let playerChoices = new Set();
  let timer = 0;
  let timerId = null;
  let phase = 'intro';
  let winCount = 0;

  // ===== Game Data =====
  const gameData = [
    { letter: "א", word: "Aleph" }, { letter: "ב", word: "Bet" },
    { letter: "ג", word: "Gimmel" }, { letter: "ד", word: "Dalet" },
    { letter: "ה", word: "Hay" }, { letter: "ו", word: "Vav" },
    { letter: "ז", word: "Zayin" }, { letter: "ח", word: "Khet" },
    { letter: "ט", word: "Tet" }, { letter: "י", word: "Yud" },
    { letter: "כ", word: "Khaf" }, { letter: "ל", word: "Lamed" },
    { letter: "מ", word: "Mem" }, { letter: "נ", word: "Nun" },
    { letter: "ס", word: "Samech" }, { letter: "ע", word: "Ayin" },
    { letter: "פ", word: "Fay" }, { letter: "צ", word: "Tzadi" },
    { letter: "ק", word: "Koof" }, { letter: "ר", word: "Resh" },
    { letter: "ש", word: "Shin" }, { letter: "ת", word: "Tav" }
  ];

  // ===== Intro Slideshow =====
  let introInterval = null;
  let lastIntroIndex = -1;
  const FADE_DURATION = 500;   // ms
  const CHANGE_INTERVAL = 2000; // ms

  function startIntroSlideshow() {
    stopIntroSlideshow();
    if (!introContent) return;
    introContent.textContent = "?";
    introContent.style.opacity = 1;

    introInterval = setInterval(() => {
      introContent.style.opacity = 0;
      setTimeout(() => {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * gameData.length);
        } while (randomIndex === lastIntroIndex);
        lastIntroIndex = randomIndex;

        introContent.textContent = gameData[randomIndex].letter;
        void introContent.offsetWidth; // restart transition
        introContent.style.opacity = 1;
      }, FADE_DURATION);
    }, CHANGE_INTERVAL);
  }

  function stopIntroSlideshow() {
    if (introInterval) {
      clearInterval(introInterval);
      introInterval = null;
    }
  }

  // ===== Helpers =====
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function onlyShow(containerToShow) {
    [introContainer, questionContainer, answerContainer].forEach(el => {
      if (el === containerToShow) el.classList.remove('hidden');
      else el.classList.add('hidden');
    });
  }

  function setTitleSeconds(n) {
    if (gameTitleText) {
      gameTitleText.textContent = `${n} seconds left`;
      fitTitle();
    }
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function resetACells() { aCells.forEach(c => c.classList.remove('correct','incorrect')); }
  function clearQCellBackgrounds() { qCells.forEach(c => c.style.backgroundColor = 'white'); }

  // ===== Resize & Title fitting =====
  function fitTextToOneLine(el) {
    if (!el || !el.parentElement) return;
    const parent = el.parentElement;
    // start with a reasonably large font size based on parent dimensions
    const parentH = Math.max(12, parent.clientHeight || 24);
    const parentW = Math.max(20, parent.clientWidth || 40);
    // reasonable starting px (not huge)
    let fontSize = Math.floor(Math.min(parentH * 0.8, parentW * 0.2, 200));
    if (fontSize < 8) fontSize = 8;
    el.style.fontSize = fontSize + 'px';

    // shrink until fits on one line
    // allow a tiny padding (4px)
    const maxWidth = parent.clientWidth - 4;
    while (el.scrollWidth > maxWidth && fontSize > 8) {
      fontSize--;
      el.style.fontSize = fontSize + 'px';
    }
  }

  function fitTitle() {
    fitTextToOneLine(gameTitleText);
  }

  // ===== Game Modes =====
  function showIntro() {
    stopTimer();
    phase = 'intro';
    onlyShow(introContainer);
    if (gameTitleText) {
      gameTitleText.textContent = 'CHECK YOUR MEMORY!';
      fitTitle();
    }
    startIntroSlideshow();
  }

  function startQuestionMode() {
    stopIntroSlideshow();
    if (winCount >= 10) { BlueDiamonds.forEach(img => img.classList.remove('glowing-BlueDiamond')); winCount = 0; }
    playerChoices.clear();
    resetACells();
    clearQCellBackgrounds();

    answerPool = shuffle(gameData).slice(0,16);
    aCells.forEach((cell, idx) => {
      const { letter } = answerPool[idx];
      cell.textContent = letter;
      cell.dataset.letter = letter;
    });

    rightLetters = shuffle(answerPool).slice(0,4);
    qCells.forEach((cell, idx) => {
      cell.textContent = rightLetters[idx].letter;
      cell.style.backgroundColor = 'white';
    });

    phase = 'question';
    onlyShow(questionContainer);
    timer = 4;
    setTitleSeconds(timer);
    stopTimer();
    timerId = setInterval(() => {
      timer--;
      if (timer >= 0) setTitleSeconds(timer);
      if (timer <= 0) { stopTimer(); startAnswerMode(); }
    }, 1000);
  }

  function startAnswerMode() {
    phase = 'answer';
    onlyShow(answerContainer);
    timer = 12;
    setTitleSeconds(timer);
    stopTimer();
    timerId = setInterval(() => {
      timer--;
      if (timer >= 0) setTitleSeconds(timer);
      if (timer <= 0) { stopTimer(); startResultMode(); }
    }, 1000);
  }

  function startResultMode() {
    phase = 'result';
    onlyShow(questionContainer);
    qCells.forEach((cell, idx) => {
      const letter = rightLetters[idx].letter;
      cell.style.backgroundColor = playerChoices.has(letter) ? '#92e6a9' : '#f69494';
    });
    const allCorrect = rightLetters.every(r => playerChoices.has(r.letter)) && playerChoices.size === 4;
    if (allCorrect) {
      winCount++;
      if (winCount >= 10) {
        BlueDiamonds.forEach(img => img.classList.add('glowing-BlueDiamond'));
        if (gameTitleText) { gameTitleText.textContent = 'YOU ARE THE BEST!'; fitTitle(); }
      } else {
        if (gameTitleText) { gameTitleText.textContent = 'You WON!!!'; fitTitle(); }
        const slot = BlueDiamonds[winCount - 1];
        if (slot) slot.classList.add('glowing-BlueDiamond');
      }
    } else {
      if (gameTitleText) { gameTitleText.textContent = 'You LOST!'; fitTitle(); }
    }
  }

  // ===== Answer click =====
  aCells.forEach(cell => {
    cell.addEventListener('click', () => {
      if (phase !== 'answer') return;
      const letter = cell.dataset.letter;
      if (!letter || playerChoices.has(letter) || playerChoices.size >= 4) return;
      const isCorrect = rightLetters.some(r => r.letter === letter);
      playerChoices.add(letter);
      cell.classList.add(isCorrect ? 'correct':'incorrect');
      if (playerChoices.size >= 4) { stopTimer(); startResultMode(); }
    });
  });

  // ===== Buttons =====
  newGameButton.addEventListener('click', startQuestionMode);
  gameOverButton.addEventListener('click', showIntro);
  fullScreenButton.addEventListener('click', () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  // ===== Resize =====
  function resizeBigTable() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const portraitRatio = 1 / 1.45;
    const bigTable = document.querySelector('.big-table');
    if (!bigTable) return;
    if (vw / vh < portraitRatio) {
      bigTable.style.width = vw + 'px';
      bigTable.style.height = (vw / portraitRatio) + 'px';
    } else {
      bigTable.style.height = vh + 'px';
      bigTable.style.width = (vh * portraitRatio) + 'px';
    }

    // after size changes, make sure title fits
    fitTitle();
  }

  window.addEventListener('resize', resizeBigTable);
  window.addEventListener('DOMContentLoaded', () => { resizeBigTable(); showIntro(); });

})();
</script>

</body>
</html>
