<!DOCTYPE html>
<html>
<head>
<title>MemGame-3</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"><link type="text/css" rel="stylesheet" href="resources/sheet.css" >

<style type="text/css">
html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: #7275f4;
    display: flex;
    justify-content: center;
    align-items: center;
}

.big-table {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    aspect-ratio: 1 / 1.45;
    border: 10pt outset orange;
    background-color: yellow;
    text-align: center;
    font-family: Times;
    font-weight: 800;
    margin: 0 auto;
    color: #000;
    width: 100%;
    max-width: 100vh;
    height: auto;
}

/* Define proportional heights */
.game-title {
    flex: 0 0 20%;
    font-size: clamp(3.75rem, 3.75vw, 4rem);
    color: #2005af;
    display: flex;
    align-items: center;
    justify-content: center;
}

.button-container {
    flex: 0 0 15%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 0 5px;
}

.button-container .button {
    flex: 1;
    height: 80%;
    margin: 0 10px;
    border: 7px outset #706f6f;
    border-radius: 15%;
    box-shadow: 0 5px 10px #00000033;
    outline: none;
    padding: 0;
    font-family: Verdana, sans-serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 800;
    line-height: 1;
    text-decoration: none;
    color: black;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    cursor: pointer;
}

.button-container .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
}

.button-container .button:active {
    transform: translateY(0);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    border-style: inset;
}

.master-table-container {
    flex: 1 1 65%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 10px outset blue;
    border-radius: 0px;
    background-color: #fcf4dd;
    padding: 0.5rem;
    margin: 1%;
}

.master-table {
    width: 100%;
    height: 100%;
    table-layout: fixed;
    border-collapse: separate;
    line-height: 1.1;
}

    .b-cell {
    height:calc(100% / 4);
    border: 4px solid grey;
    border-radius: 25%;
    background-color: white;
    text-align: center;
    font-size: clamp(1vh, 30pt, 5vh);
    line-height: 1.1;
    transition: opacity 0.5s ease-in-out;
}
    .b-cell.invisible-text {
    color: transparent;
    text-shadow: none;
}
    
    .c-Cell-A, .c-Cell-B, .c-Cell-C, .c-Cell-D { border: 4px solid #a0aec0; background-color: white; font-size:  clamp(5vh, 60pt, 9vh); padding:0 20pt;}

    .c-Cell-A { border-radius: 50% 0 0 0; vertical-align: bottom; text-align: right;}
    .c-Cell-B { border-radius: 0 50% 0 0; vertical-align: bottom; text-align: left; }
    .c-Cell-C { border-radius: 0 0 50% 0; vertical-align: top; text-align: left; }
    .c-Cell-D { border-radius: 0 0 0 50%; vertical-align: top; text-align: right; } 
         
    .masterTable td:not(.c-Cell-A, .c-Cell-B, .c-Cell-C, .c-Cell-D):hover {
        transform: scale(1.03); background-color: yellow;
    }

    /* Keyframe animation for shake effect */
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }
    /* Game result animation */
    @keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.3); }
  100% { transform: scale(1); }
}

.game-title.pop {
  animation: pop 0.4s ease;
}

    
</style>
<body>
  <div class="big-table" id="bigTable">
    <div class="game-title" id="gameTitle">Find the Numbers!</div>

    <div class="button-container">
      <div class="button full-screen-button" id="fullScreenButton" style="background-color: #a9a6f9">FULL<br>SCREEN</div>
      <div class="button new-game-button" id="newGameButton" style="background-color: #b6f197">NEW<br>GAME</div>
      <div class="button game-over-button" id="gameOverButton" style="background-color: #f1a697">
        <a href="../Choice.html">GAME<br>OVER</a>
      </div>
    </div>

    <div class="master-table-container">
      <table class="master-table" id="masterTable" cellspacing="5">
        <tr>
                <td class="b-cell" id="cell-0">1</td>
                <td class="b-cell" id="cell-1">2</td>
                <td class="b-cell" id="cell-2">3</td>
                <td class="b-cell" id="cell-3">4</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-4">12</td>
                <td class="c-Cell-A" id="cell-5">A</td>
                <td class="c-Cell-B" id="cell-6">B</td>
                <td class="b-cell" id="cell-7">5</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-8">11</td>
                <td class="c-Cell-D" id="cell-9">D</td>
                <td class="c-Cell-C" id="cell-10">C</td>
                <td class="b-cell" id="cell-11">6</td>
            </tr>
            <tr>
                <td class="b-cell" id="cell-12">7</td>
                <td class="b-cell" id="cell-13">8</td>
                <td class="b-cell" id="cell-14">9</td>
                <td class="b-cell" id="cell-15">10</td>
            </tr>
      </table>
    </div>
  </div>

<script>
    function resizeBigTable() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const portraitRatio = 1 / 1.45;
      const bigTable = document.querySelector('.big-table');
      // Calculate which dimension to use so the table always fits
      if (vw / vh < portraitRatio) {
        // Screen is too tall, fit width
        bigTable.style.width = vw + 'px';
        bigTable.style.height = (vw / portraitRatio) + 'px';
      } else {
        // Screen is too wide, fit height
        bigTable.style.height = vh + 'px';
        bigTable.style.width = (vh * portraitRatio) + 'px';
      }
    }
    window.addEventListener('resize', resizeBigTable);
    window.addEventListener('DOMContentLoaded', resizeBigTable);

    function endGameWin() {
        gameTitle.textContent = "You Won!!!"; // Change title to victory message
        isGameActive = false; // Set game to inactive
        newGameButton.disabled = false; // Ensure the new game button is enabled for replay
        gameOverButton.disabled = true; // Disable game over button when won

        // Disable clicks on all cells to prevent further interaction after winning
        masterCells.forEach(cell => {
            cell.style.pointerEvents = 'none'; // Disable pointer events
            cell.onclick = null; // Remove the click event listener
        });
    }

    if (fullScreenButton) {
        fullScreenButton.addEventListener('click', () => {
            // Check if full screen is even enabled by the browser/environment
            if (!document.fullscreenEnabled) {
                console.warn("Full-screen mode is not enabled or allowed by this browser/environment.");
                alert("Full-screen mode is currently restricted by your browser or the embedding environment (e.g., an iframe). Please check your browser settings or ensure the page is opened directly, not embedded.");
                return; // Exit the function if not enabled
            }

            if (!document.fullscreenElement) {
                // If not in full-screen, request full-screen for the whole document
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') {
                        alert("Full-screen mode could not be activated. This is often due to browser security policies or if the page is embedded in an iframe without the 'allowfullscreen' attribute.");
                    } else {
                        alert("Full-screen mode could not be activated due to an unexpected error.");
                    }
                });
            } else {
                // If in full-screen, exit full-screen
                document.exitFullscreen().catch(err => {
                    console.error(`Error attempting to exit full-screen mode: ${err.message} (${err.name})`);
                    alert("Error exiting full-screen mode.");
                });
            }
        });
    }

    // Initialize the game when the DOM content has loaded
    document.addEventListener('DOMContentLoaded', initializeGame);
</script>

</body>
</html>
