<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC-GAME</title>
<style>
    body {
        font-family: 'Times';
        background-color: #b7ceec;
        display: flex;
        flex-direction: column;
        justify-content: center; /* Center content vertically */
        align-items: center;
        min-height: 100vh;
        margin: 1% auto 1%;
        padding: 1rem;
        box-sizing: border-box;
    }

    .game-title {
        font-family: 'Optima';
        color: darkblue;
        font-weight: bold;
        margin: 0 auto;
        padding: 10pt;
        white-space: nowrap; /* Prevent text wrapping */
        font-size: 52pt; /* Default for desktop */
    }

    .bigTable {
        width: 98%; /* Default width for desktop */
        max-width: 900px; /* Maximum width for the entire game on large screens */
        margin: 0 auto 0;
        border: 6px solid orange;
        border-radius: 0px;
        aspect-ratio: 1 / 1; /* Keep a square aspect ratio */
        box-sizing: border-box;
        background-color: #f9f37d;
    }
   
    .masterTable {
        margin: auto;
        width: 100%;
        aspect-ratio: 6 / 4; /* Maintain the grid shape */
        border: 6px solid #4a5568;
        border-radius: 0px;
        background-color: #fcf4dd;
/*        border-collapse: collapse; /* Uncommented for correct spacing with padding */
        max-width: 880px; /* Slightly less than bigTable max-width */
        table-layout: fixed; /* Keep fixed layout for predictable columns */
        height: auto;
    }

    /* Styles for the standard game cells */
    .masterTable td:not(.grouped-cell) {
        border: 4px solid #a0aec0;
        border-radius: 45%;
        background-color: white;
        height: 100px; /* Default height for cells on desktop */
        padding: 5px; /* Add internal padding to simulate spacing */
        width: calc(100% / 6); /* Simpler width calculation now that spacing is handled by padding */
        text-align: center;
        vertical-align: middle;
        font-size: 36pt; /* Default font size for desktop cells */
        font-weight: bold;
        color: #2d3748;
        cursor: pointer;
        box-sizing: border-box;
        position: relative; /* Needed for absolutely positioned image in grouped-cell */
    }
    .grouped-cell {
    border: 4px solid #a0aec0;
        border-radius: 45%;
    }
    .masterTable td:not(.grouped-cell):hover {
        transform: scale(1.03);
    }

    /* Styling for correctly guessed cells (light green) */
    .masterTable td.correct {
        background-color: #9ae6b4; /* Light green */
        pointer-events: none; /* Disable further clicks on correct cells */
        cursor: default;
    }

    /* Styling for incorrectly guessed cells (red) */
    .masterTable td.incorrect {
        background-color: #fc8181; /* Red */
        animation: shake 0.5s ease-out;
    }

    /* Keyframe animation for shake effect */
    @keyframes shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
    }

    /* Styles for the grouped cell (the one with the image) */
    .grouped-cell {
        border-radius: 0%;
        background-color: white;
        transform: scale(0.97);
        margin: 0;
        text-align: center;
        vertical-align: middle;
        overflow: hidden;
        padding: 5px; /* Ensure padding is consistent */
        font-size: 42pt; /* Default font size for desktop grouped cell */
        position: relative; /* Absolutely essential for positioning the image */
    }

    /* Styles for the image inside the grouped cell */
    .grouped-cell img {
        height: 80%; /* Default height for image on desktop */
        object-fit: contain; /* Ensure image scales properly within its bounds */
        display: block; /* Make image a block element */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%); /* Centering trick */
        max-width: 100%; /* Ensure it doesn't overflow its own bounds */
        max-height: 100%; /* Ensure it doesn't overflow its own bounds */
    }
   
    button {
        padding: 10px 10px;
        font-family: 'Times';
        font-size: 1.5em;
        font-weight: bold;
        color: darkblue;
        border: 12px outset;
        border-radius: 25px;
        border-color: grey;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
        box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        margin: 0;
        outline: none;
    }

    .game-over-button a {
        text-decoration: none; /* Removes the underline */
        color: darkblue;
    }

    /* Button specific colors */
    .full-screen-button { background-color:#c2b3ee }
    .new-game-button { background-color:#93fcb3 }
    .game-over-button { background-color:#fcbb93 }

    /* Hover and active states for all buttons */
    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
    }
    button:active {
        transform: translateY(0);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        border-style: inset; /* Added for press-down effect */
    }

    /* --- Styles for the button container to spread them evenly --- */
    #buttonContainer {
    
    width: 90%;
    margin:0 auto;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between; /* Distributes space between items, pushes first/last to edges */
    align-items: center;
    gap: 10px; /* Still useful for vertical spacing if they wrap */
    padding: 5px;
}

#buttonContainer button {
    flex-grow: 1; /* Allows buttons to grow and fill available space */
    flex-shrink: 1;
    min-width: 120px; /* Keeps buttons from getting too small */
    max-width: 200px; /* Prevents them from getting too wide */
    margin: 5px; /* Adds space around individual buttons */
}

    #buttonContainer .game-title {
        flex-basis: 100%; /* Make the title take full width */
        text-align: center;
        margin-bottom: 0px; /* Space below the title */
    }
</style>
    
<body>
<table class="bigTable" style="margin: 0 auto; text-align:center;">
<tr><td id="buttonContainer"> <!-- Added ID here for styling -->
    <ul class="game-title" id="gameTitle">Find the LETTER!</ul>
    <button class="full-screen-button" id="fullScreenButton">FULL<br>SCREEN</button>
    <!-- HTML structure: NEW GAME is a button, GAME OVER is a link -->
    <button class="new-game-button" id="newGameButton">NEW<br>GAME</button>
    <button class="game-over-button" id="gameOverButton"><a href="Choice.html">GAME<br>OVER</a></button>
</td></tr>

        <tr><td><table class="masterTable" style="text-align:center; background-color:#fcf4dd;">
            <tr>
                <td id="cell-0">Cell 11</td>
                <td id="cell-1">Cell 12</td>
                <td class="grouped-cell" colspan="2"></td>
                <td id="cell-2">Cell 15</td>
                <td id="cell-3">Cell 16</td>
            </tr>
            <tr>
                <td id="cell-4">Cell 21</td>
                <td id="cell-5">Cell 22</td>
                <td id="cell-6">Cell 23</td>
                <td id="cell-7">Cell 24</td>
                <td id="cell-8">Cell 25</td>
                <td id="cell-9">Cell 26</td>
            </tr>
            <tr>
                <td id="cell-10">Cell 31</td>
                <td id="cell-11">Cell 32</td>
                <td id="cell-12">Cell 33</td>
                <td id="cell-13">Cell 34</td>
                <td id="cell-14">Cell 35</td>
                <td id="cell-15">Cell 36</td>
            </tr>
            <tr>
                <td id="cell-16">Cell 41</td>
                <td id="cell-17">Cell 42</td>
                <td id="cell-18">Cell 43</td>
                <td id="cell-19">Cell 44</td>
                <td id="cell-20">Cell 45</td>
                <td id="cell-21">Cell 46</td>
            </tr>
        </table></td></tr> 
    </table>

<script>
    // This array serves as your "DataBase table" (invisible).
    // Each object contains the letter and a letter's name.
const gameData = [
    { letter: "א", word: "Aleph" },
    { letter: "ב", word: "Bet" },
    { letter: "ג", word: "Gimmel" },
    { letter: "ד", word: "Dalet" },
    { letter: "ה", word: "Hay" },
    { letter: "ו", word: "Vav" },
    { letter: "ז", word: "Zayin" },
    { letter: "ח", word: "Khet" },
    { letter: "ט", word: "Tet" },
    { letter: "י", word: "Yud" },
    { letter: "כ", word: "Chaf" },
    { letter: "ל", word: "Lamed" },
    { letter: "מ", word: "Mem" },
    { letter: "נ", word: "Nun" },
    { letter: "ס", word: "Samech" },
    { letter: "ע", word: "Ayin" },
    { letter: "פ", word: "Fay" },
    { letter: "צ", word: "Tzadi" },
    { letter: "ק", word: "Koof" },
    { letter: "ר", word: "Resh" },
    { letter: "ש", word: "Shin" },
    { letter: "ת", word: "Tav" }
];

let currentGridLetters = []; // Letters randomly populated on the grid cells
let foundLetters = new Set(); // Stores letters (strings) that have been correctly found
let currentWordIndex = 0; // Tracks the index of the word currently displayed from the original gameData

// --- Game Initialization and Setup (Called on page load and by "NEW GAME" button) ---
function initializeGame() {
    const gameCells = Array.from(document.querySelectorAll('.masterTable td:not(.grouped-cell)'));
    const groupedCell = document.querySelector('.grouped-cell');
    const gameTitle = document.getElementById('gameTitle');

    // Reset game state variables for a new round
    foundLetters.clear();
    currentWordIndex = 0; // Start from the beginning of the alphabetical list

    // Randomly populate cells with ALL gameData letters
    // Create a shuffled copy of gameData for grid placement
    currentGridLetters = [...gameData].sort(() => 0.5 - Math.random());

    // Populate cells with letters from currentGridLetters and enable them
    gameCells.forEach((cell, index) => {
        if (index < currentGridLetters.length) {
            cell.textContent = currentGridLetters[index].letter;
        } else {
            cell.textContent = ''; // Clear any extra cells
        }
        cell.classList.remove('correct', 'incorrect'); // Clean state
        cell.style.pointerEvents = 'auto'; // Enable clicks
        cell.style.cursor = 'pointer';
        cell.onclick = () => handleCellClick(cell); // Attach click handler
    });

    // Set the first target word and display its word (from the alphabetical gameData)
    // The current target is always based on currentWordIndex in the original gameData
    groupedCell.textContent = gameData[currentWordIndex].word;

    // Update the game title
    gameTitle.textContent = "Find the LETTER!";
}

// --- Game Logic (Handles cell clicks) ---
function handleCellClick(clickedCell) {
    const clickedLetter = clickedCell.textContent;
    const groupedCell = document.querySelector('.grouped-cell');
    const gameTitle = document.getElementById('gameTitle');

    // Get the letter that is currently being sought (from the original, alphabetical gameData)
    const targetLetter = gameData[currentWordIndex].letter;

    // Scenario 1: **Already found letter** (clicking a green cell)
    if (foundLetters.has(clickedLetter)) {
        console.log(`Letter '${clickedLetter}' has already been found. No action.`);
        return; // Do nothing, exit the function
    }

    // Scenario 2: **Correctly clicked the currently displayed target letter**
    if (clickedLetter === targetLetter) {
        clickedCell.classList.add('correct');
        clickedCell.style.pointerEvents = 'none';
        clickedCell.style.cursor = 'default';
        foundLetters.add(clickedLetter); // Add the found letter to our set

        // Check if all letters have been found (game won)
        if (foundLetters.size === gameData.length) {
            gameTitle.textContent = "YOU WON!!!";
            document.querySelectorAll('.masterTable td:not(.grouped-cell)').forEach(cell => {
                cell.style.pointerEvents = 'none';
                cell.style.cursor = 'default';
            });
            groupedCell.textContent = "Great Job!";
        } else {
            // Game continues: Find and display the next UNFOUND target word
            // We advance currentWordIndex and skip any words already found
            currentWordIndex++;
            while (currentWordIndex < gameData.length && foundLetters.has(gameData[currentWordIndex].letter)) {
                currentWordIndex++;
            }

            if (currentWordIndex < gameData.length) {
                groupedCell.textContent = gameData[currentWordIndex].word; // Display next target word
            } else {
                // This case should ideally be caught by foundLetters.size === gameData.length
                // but acts as a safeguard.
                groupedCell.textContent = "Great Job!";
            }
        }
    } else {
        // Scenario 3: **Incorrect click** (not the current target, and not already found)
        clickedCell.classList.add('incorrect');
        clickedCell.addEventListener('animationend', () => {
            clickedCell.classList.remove('incorrect');
        }, { once: true });
        // The game continues, groupedCell display does not change
    }
}

// --- Button Functionality ---
document.getElementById('fullScreenButton').addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
        });
    } else {
        document.exitFullscreen();
    }
});

// Event listener for the "NEW GAME" button
document.getElementById('newGameButton').addEventListener('click', initializeGame);

// --- Initial Setup on Page Load ---
document.addEventListener('DOMContentLoaded', () => {
    // Immediately start a new game when the page loads
    initializeGame();
});
</script>
    
</body>
</html>
