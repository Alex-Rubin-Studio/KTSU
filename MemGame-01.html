<!DOCTYPE html>
<html>
<head>
    <title>MemGame-01</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link type="text/css" rel="stylesheet" href="resources/sheet.css">

    <style type="text/css">
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #7275f4;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .big-table {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            aspect-ratio: 1 / 1.45;
            border: 10pt outset orange;
            background-color: #a4ffeb;
            text-align: center;
            font-family: Times;
            font-weight: 800;
            margin: 0 auto;
            color: #000;
            width: 100%;
            max-width: 100vh;
            height: auto;
        }

        /* Define proportional heights */
        .game-title {
            flex: 0 0 20%;
            font-size: clamp(3.5rem, 4.5vw, 5rem);
            color: #2005af;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-container {
            flex: 0 0 15%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 5px;
        }

        .button-container .button {
            flex: 1;
            height: 80%;
            margin: 0 10px;
            border: 7px outset #706f6f;
            border-radius: 15%;
            box-shadow: 0 5px 10px #00000033;
            outline: none;
            padding: 0;
            font-family: Arial Narrow;
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: 1000;
            line-height: 1;
            text-decoration: none;
            color: black;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }

        .button-container .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .button-container .button:active {
            transform: translateY(0);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
            border-style: inset;
        }

        .master-table-container {
            flex: 1 1 65%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 10px outset blue;
            border-radius: 0px;
            background-color: #fcf4dd;
            padding: 0.5rem;
            margin: 1%;
        }

        .master-table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: separate;
        }

        .b-cell {
            border: 4px solid grey;
            border-radius: 25%;
            background-color: white;
            text-align: center;
            font-size: clamp(1vh, 30pt, 5vh);
            line-height: 1.1;
            transition: opacity 0.5s ease-in-out; /* Added for smooth transition */
        }
        
        .c-Cell-A, .c-Cell-B, .c-Cell-C, .c-Cell-D {
            border: 4px solid #a0aec0;
            background-color: white;
            font-size: clamp(5vh, 60pt, 9vh);
            vertical-align: center; text-align: center;
            padding:0 20pt;
            visibility: hidden;
        }
        .c-Cell-A { border-radius: 50% 50% 0 50%; }
        .c-Cell-B { border-radius: 50% 50% 50% 0; }
        .c-Cell-C { border-radius: 0 50% 50% 50%; }
        .c-Cell-D { border-radius: 50% 0 50% 50%; }
        
        .b-cell:hover {
            transform: scale(1.03);
            background-color: yellow;
        }

        /* Keyframe animation for shake effect */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        /* Game result animation */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .game-title.pop {
            animation: pop 0.4s ease;
        }

        /* NEW: Class to hide b-cells and change timer color */
        .hide-cells .b-cell {
            opacity: 0;
        }

        .countdown-red {
            color: red !important;
        }

        .countdown-green {
            color: green !important;
        }
    </style>
</head>
<body>
    <div class="big-table" id="bigTable">
        <div class="game-title" id="gameTitle">Find the Numbers!</div>

        <div class="button-container">
            <div class="button full-screen-button" id="fullScreenButton" style="background-color: #a9a6f9">FULL<br>SCREEN</div>
            <div class="button new-game-button" id="newGameButton" style="background-color: #b6f197">NEW<br>GAME</div>
            <div class="button game-over-button" id="gameOverButton" style="background-color: #f1a697">
                <a href="Choice.html">GAME<br>OVER</a>
            </div>
        </div>

        <div class="master-table-container">
            <table class="master-table" id="masterTable" cellspacing="5">
                <tr>
                    <td class="b-cell" id="cell-0">1</td>
                    <td class="b-cell" id="cell-1">2</td>
                    <td class="b-cell" id="cell-2">3</td>
                    <td class="b-cell" id="cell-3">4</td>
                    <td class="b-cell" id="cell-4">5</td>
                    <td class="b-cell" id="cell-5">6</td>
                </tr>
                <tr>
                    <td class="b-cell" id="cell-6">20</td>
                    <td class="c-Cell-A" colspan="2" rowspan="2" id="cell-14">A</td>
                    <td class="c-Cell-B" colspan="2" rowspan="2" id="cell-15">B</td>
                    <td class="b-cell" id="cell-11">7</td>
                </tr>
                <tr>
                    <td class="b-cell" id="cell-12">19</td>
                    <td class="b-cell" id="cell-17">8</td>
                </tr>
                <tr>
                    <td class="b-cell" id="cell-18">18</td>
                    <td class="c-Cell-D" colspan="2" rowspan="2" id="cell-20">D</td>
                    <td class="c-Cell-C" colspan="2" rowspan="2" id="cell-21">C</td>
                    <td class="b-cell" id="cell-23">9</td>
                </tr>
                <tr>
                    <td class="b-cell" id="cell-24">17</td>
                    <td class="b-cell" id="cell-29">10</td>
                </tr>
                <tr>
                    <td class="b-cell" id="cell-30">16</td>
                    <td class="b-cell" id="cell-31">15</td>
                    <td class="b-cell" id="cell-32">14</td>
                    <td class="b-cell" id="cell-33">13</td>
                    <td class="b-cell" id="cell-34">12</td>
                    <td class="b-cell" id="cell-35">11</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // Make the board responsive to screen size
        function resizeBigTable() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const portraitRatio = 1 / 1.45;
            const bigTable = document.querySelector('.big-table');
            if (vw / vh < portraitRatio) {
                bigTable.style.width = vw + 'px';
                bigTable.style.height = (vw / portraitRatio) + 'px';
            } else {
                bigTable.style.height = vh + 'px';
                bigTable.style.width = (vh * portraitRatio) + 'px';
            }
        }

        // Run on load and resize
        window.addEventListener('resize', resizeBigTable);
        window.addEventListener('DOMContentLoaded', () => {
            resizeBigTable();

            // FULLSCREEN BUTTON logic
            const fullScreenButton = document.getElementById("fullScreenButton");
            if (fullScreenButton) {
                fullScreenButton.addEventListener('click', () => {
                    if (!document.fullscreenEnabled) {
                        alert("Full-screen mode is currently restricted.");
                        return;
                    }
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            alert("Full-screen failed.");
                        });
                    } else {
                        document.exitFullscreen().catch(err => {
                            alert("Exiting full-screen failed.");
                        });
                    }
                });
            }

            // === NEW GAME BUTTON logic ===
            const newGameButton = document.getElementById("newGameButton");
            const gameTitle = document.getElementById("gameTitle");
            const masterCells = document.querySelectorAll(".b-cell");
            const masterTableContainer = document.querySelector('.master-table-container');

            const cCells = {
                A: document.getElementById("cell-14"),
                B: document.getElementById("cell-15"),
                C: document.getElementById("cell-21"),
                D: document.getElementById("cell-20")
            };

            // Get 4 unique random numbers from 1–20
            function getRandomUniqueNumbers(count, min, max) {
                const numbers = new Set();
                while (numbers.size < count) {
                    numbers.add(Math.floor(Math.random() * (max - min + 1)) + min);
                }
                return Array.from(numbers);
            }

            // Handler: NEW GAME
            let correctNumbers = [];
            let foundNumbers = new Set();
            let guessTimer = null;

            function handleNewGame() {
                // Reset game state
                clearInterval(guessTimer);
                foundNumbers.clear();
                correctNumbers = getRandomUniqueNumbers(4, 1, 20);

                // Hide b-cells and set countdown color to red
                masterTableContainer.classList.add('hide-cells');
                gameTitle.classList.add('countdown-red');
                gameTitle.classList.remove('countdown-green');

                // Show C-cells with numbers
                Object.values(cCells).forEach((cell, index) => {
                    cell.textContent = correctNumbers[index];
                    cell.style.visibility = "visible";
                    cell.style.backgroundColor = "white";
                });

                // Start 5-sec MEMORIZE countdown
                let countdown = 5;
                gameTitle.textContent = `Memorize: ${countdown}`;
                const memorizeInterval = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        gameTitle.textContent = `Memorize: ${countdown}`;
                    } else {
                        clearInterval(memorizeInterval);

                        // Hide C-cells again
                        Object.values(cCells).forEach(cell => {
                            cell.style.visibility = "hidden";
                        });

                        // Start 15-sec GUESS phase
                        startGuessingPhase();
                    }
                }, 1000);
            }

            function startGuessingPhase() {
                let timeLeft = 15;
                gameTitle.textContent = `Time Left: ${timeLeft}`;

                // Show b-cells and set countdown color to green
                masterTableContainer.classList.remove('hide-cells');
                gameTitle.classList.remove('countdown-red');
                gameTitle.classList.add('countdown-green');

                // Allow player to click b-cells
                masterCells.forEach(cell => {
                    cell.style.pointerEvents = "auto";
                    cell.style.backgroundColor = "white";
                    cell.onclick = () => handleCellClick(cell);
                });

                // Start countdown timer
                guessTimer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        gameTitle.textContent = `Time Left: ${timeLeft}`;
                    } else {
                        clearInterval(guessTimer);
                        endGame(false); // Time ran out
                    }
                }, 1000);
            }

            function handleCellClick(cell) {
                const number = parseInt(cell.textContent);

                if (correctNumbers.includes(number)) {
                    if (!foundNumbers.has(number)) {
                        foundNumbers.add(number);
                        cell.style.backgroundColor = "lightgreen";

                        // Reveal the number in the correct C-cell
                        Object.values(cCells).forEach(cCell => {
                            if (parseInt(cCell.textContent) === number) {
                                cCell.style.visibility = "visible";
                                cCell.style.backgroundColor = "lightgreen";
                            }
                        });

                        // Check win condition
                        if (foundNumbers.size === 4) {
                            clearInterval(guessTimer);
                            endGame(true);
                        }
                    }
                } else {
                    // Wrong guess
                    cell.style.backgroundColor = "red";
                    setTimeout(() => {
                        cell.style.backgroundColor = "white";
                    }, 1000);
                }
            }

            function endGame(won) {
                masterCells.forEach(cell => {
                    cell.onclick = null;
                    cell.style.pointerEvents = "none";
                });

                // Remove color classes from game title
                gameTitle.classList.remove('countdown-red', 'countdown-green');

                if (won) {
                    gameTitle.textContent = "You WON!!!";
                } else {
                    gameTitle.textContent = "You LOST!!!";

                    // Reveal missing C-cells in red
                    correctNumbers.forEach(num => {
                        if (!foundNumbers.has(num)) {
                            Object.values(cCells).forEach(cCell => {
                                if (parseInt(cCell.textContent) === num) {
                                    cCell.style.visibility = "visible";
                                    cCell.style.backgroundColor = "red";
                                }
                            });
                        }
                    });
                }
            }

            newGameButton.addEventListener('click', handleNewGame);
        });
    </script>
</body>
</html>
